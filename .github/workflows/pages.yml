name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build every project folder
        run: |
          set -e
          mkdir -p _site
          list=""
          for dir in */; do
            slug="${dir%/}"
            case "$slug" in _*|node_modules) continue ;; esac
            [ -f "$slug/astro.config.mjs" ] || continue
            echo "::group::build $slug"
            (
              cd "$slug"
              npm install --no-audit --no-fund
              DEMO_BASE="/demo/$slug/" npx astro build
              if [ -f scripts/ki-hinweis.mjs ]; then node scripts/ki-hinweis.mjs; fi
            )
            rm -f "$slug/dist/.htaccess"
            cp -r "$slug/dist" "_site/$slug"
            list="$list<li><a href=\"$slug/\">$slug</a></li>"
            echo "::endgroup::"
          done
          printf '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Demo</title><body style="font:18px/1.6 system-ui;margin:2rem"><h1>Demo</h1><ul>%s</ul>' "$list" > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
