<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Azulejo-Wand: 2x2 Fliesen (Rosette, Raute). Farben = Tokens aus tokens.css -->
  <defs>
    <clipPath id="cp"><rect width="100" height="100"/></clipPath>
    <g id="corners">
      <g fill="#DCE4F3" stroke="#1D43A0" stroke-width="3">
        <circle cx="0" cy="0" r="20"/><circle cx="100" cy="0" r="20"/>
        <circle cx="0" cy="100" r="20"/><circle cx="100" cy="100" r="20"/>
      </g>
      <g fill="#1D43A0">
        <circle cx="0" cy="0" r="7"/><circle cx="100" cy="0" r="7"/>
        <circle cx="0" cy="100" r="7"/><circle cx="100" cy="100" r="7"/>
      </g>
    </g>
    <g id="a" clip-path="url(#cp)">
      <rect width="100" height="100" fill="#F8FAFC"/>
      <use href="#corners"/>
      <g transform="translate(50 50)">
        <ellipse rx="8" ry="24" fill="#1D43A0"/>
        <ellipse rx="8" ry="24" transform="rotate(90)" fill="#1D43A0"/>
        <ellipse rx="6" ry="18" transform="rotate(45)" fill="#DCE4F3" stroke="#1D43A0" stroke-width="2.5"/>
        <ellipse rx="6" ry="18" transform="rotate(135)" fill="#DCE4F3" stroke="#1D43A0" stroke-width="2.5"/>
        <circle r="6" fill="#E3A82B" stroke="#1D43A0" stroke-width="2"/>
      </g>
      <rect x=".75" y=".75" width="98.5" height="98.5" fill="none" stroke="#1D43A0" stroke-opacity=".35" stroke-width="1.5"/>
    </g>
    <g id="b" clip-path="url(#cp)">
      <rect width="100" height="100" fill="#F8FAFC"/>
      <use href="#corners"/>
      <polygon points="50,12 88,50 50,88 12,50" fill="#DCE4F3" stroke="#1D43A0" stroke-width="3"/>
      <polygon points="50,28 72,50 50,72 28,50" fill="#1D43A0"/>
      <circle cx="50" cy="50" r="7" fill="#E3A82B" stroke="#F8FAFC" stroke-width="2"/>
      <rect x=".75" y=".75" width="98.5" height="98.5" fill="none" stroke="#1D43A0" stroke-opacity=".35" stroke-width="1.5"/>
    </g>
  </defs>
  <use href="#a" x="0" y="0"/>
  <use href="#b" x="100" y="0"/>
  <use href="#b" x="0" y="100"/>
  <use href="#a" x="100" y="100"/>
</svg>
